<!DOCTYPE html>
<html>
<head>
  <title>WELCOME to Instagram</title>
  <style>
 body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
  font-family: Arial, sans-serif;
}

h1 {
  color: white;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
  text-shadow: 0 10px 10px rgb(5, 5, 5);
  margin-bottom: 25px;
}

.container {
  background: rgba(255, 255, 255, 0.12);
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  width: 220px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  background: white;
  color: #833ab4;
  transition: 0.3s;
}

button:hover {
  background: #833ab4;
  color: white;
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>
  
  <h1>  WELCOME In Instagram </h1>
  
  <br><br>

  <!-- <img src = "./img/free.png"> -->

 <div class="container">


    <div class="buttons">
        
      <a href="signup.html"><button>SIGN UP</button></a>  
     
      <a href="signin.html"><button>SIGN IN</button></a>  

    </div>

  </div>

</body>
</html>
